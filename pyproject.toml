[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qddate"
version = "1.0.15"
description = "Quick and dirty date parsing Python library to parse HTML dates really fast"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD"}
authors = [
    {name = "Ivan Begtin", email = "ivan@begtin.tech"}
]
maintainers = [
    {name = "Ivan Begtin", email = "ivan@begtin.tech"}
]
keywords = ["date", "datetime", "parsing", "html", "scraping"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "pyparsing>=3.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
bench = [
    "dateparser>=1.2.0",
    "python-dateutil",
    "arrow",
    "pendulum",
]
dev = [
    "ruff",
    "tox",
    "twine",
    "build",
]

[project.urls]
Homepage = "https://github.com/ivbeg/qddate"
Documentation = "https://ivbeg.github.io/qddate/"
Repository = "https://github.com/ivbeg/qddate"
Issues = "https://github.com/ivbeg/qddate/issues"

[tool.setuptools]
# Automatically discover packages, excluding tests
packages = {find = {exclude = ["tests", "tests.*"]}}
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
"qddate" = ["py.typed", "*.md", "*.txt"]
"*" = ["*.md", "*.txt"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Pattern-table and docs-generator scripts contain long, unbreakable
# structure-driven lines; they are not source-of-truth Python.
"scripts/generate_pattern_docs.py" = ["E501"]
"scripts/generate_webpage_test_data.py" = ["E501"]
"qddate/patterns/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
