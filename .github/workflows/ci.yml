name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      env:
        # Enable the perf smoke test on CI runners. Set to 0 to skip.
        QDDATE_PERF: "1"
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test]
        pip install ruff pytest pytest-cov

    - name: Lint with Ruff
      run: |
        # Ruff is now a gate (not advisory). Real bugs / undefined names
        # plus the configured rule set fail the build.
        ruff check qddate tests scripts

    - name: Test with pytest
      env:
        QDDATE_PERF: "1"
      run: |
        # Coverage gate: fail the build if line coverage drops below 85%.
        pytest --cov=qddate --cov-report=xml --cov-fail-under=85