[tox]
envlist = py310,py311,py312,py313,py314
minversion = 4.0

[testenv]
description = Run tests with pytest
extras = test
commands =
    pytest -v --cov=qddate --cov-report=term-missing {posargs}

[testenv:lint]
description = Run code quality checks
skip_install = true
deps =
    ruff
commands =
    ruff check qddate tests scripts benchmarks
